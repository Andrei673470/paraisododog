<style>
:root{
  --preto:#000; --fundo:#000; --painel:#141414; --painel2:#1E1E1E;
  --amarelo:#FFC107; --amarelo2:#FFD54A; --branco:#FFFFFF; --cinza:#B9B2A3; --linha:#2B2B2B;
  --verde:#25A35A; --vermelho:#E5483A;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:70px;-webkit-text-size-adjust:100%}
body{overflow-x:clip}
body{margin:0;background:var(--fundo);color:var(--branco);font-family:"Barlow",system-ui,sans-serif;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amarelo);outline-offset:2px}
img{display:block;max-width:100%}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* ===== Topo ===== */
.topo{padding:14px 0 6px;text-align:center;position:relative}
.topo .grid{display:grid;grid-template-columns:1fr;justify-items:center;gap:4px}
.logo{width:min(300px,78vw)}
.frase{white-space:nowrap;font-family:"Oswald",sans-serif;font-weight:600;text-transform:uppercase;font-size:1.05rem;line-height:1.15;transform:rotate(-4deg);display:inline-block;padding:6px 4px;position:relative}
.frase em{font-style:normal;color:var(--amarelo)}
.frase::before,.frase::after{content:"";position:absolute;left:-6px;right:-6px;height:4px;background:var(--amarelo);border-radius:4px;transform:skewX(-20deg)}
.frase::before{top:-2px}.frase::after{bottom:-2px}
.frases{display:flex;justify-content:center;gap:28px;flex-wrap:wrap;margin:6px 0 4px}
@media (min-width:720px){
  .topo .grid{grid-template-columns:1fr auto 1fr;align-items:center}
  .frases{display:contents}
  .frase.e{order:-1;justify-self:end}
  .frase.d{justify-self:start;transform:rotate(-4deg)}
}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:14px 0 6px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:.9rem;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid #3A3320;background:#14110A}
.dot{width:9px;height:9px;border-radius:50%;background:#43D17A;box-shadow:0 0 0 3px rgba(67,209,122,.18)}
.dot.fechado{background:var(--vermelho);box-shadow:0 0 0 3px rgba(229,72,58,.2)}

/* ===== Abas ===== */
.abas{position:sticky;top:0;z-index:20;background:#000;border-bottom:1px solid #2A2410}
.abas .wrap{display:flex;gap:8px;overflow-x:auto;padding-top:10px;padding-bottom:10px;scrollbar-width:none}
.abas .wrap::-webkit-scrollbar{display:none}
.aba{flex:none;border:2px solid var(--amarelo);background:transparent;color:var(--amarelo);padding:5px 14px;border-radius:8px;font-family:"Oswald",sans-serif;font-weight:600;font-size:1rem;text-transform:uppercase;letter-spacing:.02em}
.aba.ativa{background:var(--amarelo);color:#000}

/* ===== Seções ===== */
main{padding-bottom:120px}
section.cat{margin-top:30px}
.cab{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:-14px;position:relative;z-index:2}
.pincel{display:inline-block;background:var(--amarelo);color:#000;font-family:"Anton",sans-serif;font-size:clamp(2rem,9vw,2.8rem);line-height:1;padding:10px 34px 8px 18px;
  clip-path:polygon(1% 14%,8% 4%,30% 9%,55% 1%,82% 7%,100% 0,96% 34%,99% 62%,94% 100%,70% 92%,45% 99%,18% 93%,0 100%,3% 58%);margin-left:-4px}
.pincel span{display:inline-block;transform:skewX(-10deg);white-space:nowrap}
.foto-cab{width:clamp(130px,38vw,210px);margin-bottom:6px}
.caixa{border:2px solid var(--amarelo);border-radius:16px;padding:24px 14px 14px;background:#000}

/* Item grande (hot dogs) */
.item{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:2px dotted rgba(255,193,7,.55);padding:14px 2px;color:inherit}
.item:last-child{border-bottom:0}
.item h3{margin:0;font-family:"Oswald",sans-serif;font-weight:600;font-size:1.45rem;line-height:1.1;color:var(--amarelo);text-transform:uppercase}
.item p{margin:4px 0 0;font-style:italic;color:#EDE7DA;font-size:.98rem;max-width:44ch}
.item:hover h3{color:var(--amarelo2)}

/* Linha com pontilhado (pastéis, porções, bebidas) */
.linha-p{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:8px 2px;color:inherit;text-align:left}
.linha-p .n{font-family:"Oswald",sans-serif;font-size:1.22rem;text-transform:uppercase;font-weight:500;line-height:1.15}
.linha-p .n small{display:block;text-transform:none;font-family:"Barlow";font-style:italic;font-size:.88rem;color:var(--cinza);font-weight:400}
.linha-p .pont{flex:1;min-width:16px;border-bottom:2px dotted rgba(255,255,255,.55);transform:translateY(6px)}
.linha-p:hover .n{color:var(--amarelo)}

/* Etiqueta de preço */
.preco{display:inline-flex;align-items:baseline;background:var(--amarelo);color:#000;border-radius:8px;padding:2px 9px 1px;font-family:"Oswald",sans-serif;font-weight:700;line-height:1.1;flex:none;white-space:nowrap}
.preco .rs{font-size:.8rem;margin-right:4px;font-weight:600}
.preco b{font-size:1.55rem}
.preco .c{font-size:.85rem}
.preco.p{padding:1px 8px}
.preco.p b{font-size:1.3rem}
.adic{margin-top:4px;border-top:2px solid rgba(255,193,7,.25);padding-top:6px}
.adic .linha-p .n{color:var(--amarelo);font-size:1.05rem}
.adic .linha-p{cursor:default}

/* Cards (todas as categorias) */
.combos.grade{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
@media (max-width:520px){
  .combos.grade{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;overflow:visible;margin:0;padding:0}
  .combos.grade .combo{padding:10px 8px}
  .combos.grade .combo h3{font-size:1.15rem}
  .combos.grade .combo p{font-size:.84rem}
  .combos.grade .combo .por{font-size:1.35rem}
}
.combo{cursor:pointer;gap:0}
.combo p:empty{display:none}
.combo .add{margin-top:8px;width:100%;border:0;border-radius:10px;background:var(--amarelo);color:#000;font-family:"Oswald",sans-serif;font-weight:700;text-transform:uppercase;font-size:1rem;padding:9px 6px;letter-spacing:.02em}
.combo .add:hover{background:var(--amarelo2)}
.combo .na{font-size:.78rem;color:var(--amarelo);font-weight:600;margin-top:6px;min-height:1em}
.combo img.alta{width:auto;height:84px}
.combos .info{grid-column:1/-1}
/* Combos */
.combos{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
@media (max-width:520px){
  .combos{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 6px;scrollbar-width:none}
  .combos::-webkit-scrollbar{display:none}
  .combo{flex:0 0 72%;scroll-snap-align:start}
}
.combo{min-width:0;background:#000;border:2px solid #3A3214;border-radius:14px;padding:12px 12px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;color:inherit;transition:border-color .15s}
.combo:hover{border-color:var(--amarelo)}
.combo h3{margin:0;font-family:"Anton",sans-serif;font-weight:400;font-size:1.5rem;line-height:1.05;color:var(--amarelo);text-transform:uppercase}
.combo h3 span{display:inline-block;transform:skewX(-10deg);overflow-wrap:break-word;hyphens:auto}
.combo p{margin:4px 0 6px;font-size:.92rem;color:#EDE7DA;min-height:2.6em}
.combo img{width:150px;height:72px;object-fit:contain;margin:2px 0 8px}
.combo .val{border:1.5px solid var(--amarelo);border-radius:10px;padding:5px 8px;width:100%;margin-top:auto}
.combo .de{font-size:.82rem;color:var(--cinza);font-family:"Oswald";text-decoration:line-through}
.combo .por{font-family:"Oswald";font-weight:700;color:var(--amarelo);font-size:1.6rem;line-height:1}
.combo .por small{font-size:.75rem;color:var(--branco);font-weight:500;margin-right:4px}
.combo .eco{display:inline-block;background:var(--vermelho);color:#fff;font-weight:700;font-size:.72rem;padding:2px 8px;border-radius:6px;margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em}

/* Rodapé */
.rodape{margin-top:34px;display:grid;gap:18px;text-align:center;padding:10px 0 20px}
.versiculo{font-style:italic;color:#EDE7DA;margin:0;font-size:1.02rem}
.versiculo cite{display:block;font-style:normal;color:var(--amarelo);font-family:"Oswald";font-size:.85rem;margin-top:4px;letter-spacing:.04em}
.obrigado{font-family:"Anton";font-size:clamp(1.6rem,7vw,2.2rem);line-height:1;margin:0;transform:skewX(-10deg)}
.obrigado span{color:var(--amarelo);display:block;font-size:1.3em}

/* ===== Barra da sacola ===== */
.barra{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,#000 40%);pointer-events:none}
.barra button{pointer-events:auto;max-width:728px;margin:0 auto;display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;background:var(--amarelo);color:#000;border:0;border-radius:14px;padding:14px 18px;font-family:"Oswald";font-weight:700;font-size:1.15rem;text-transform:uppercase;box-shadow:0 6px 24px rgba(255,193,7,.3)}
.barra .qtd{background:#000;color:var(--amarelo);border-radius:8px;padding:0 9px;margin-right:10px}
.barra[hidden]{display:none}

/* ===== Painéis ===== */
.fundo{visibility:hidden;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:40;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.fundo.aberto{visibility:visible;opacity:1;pointer-events:auto}
.p-corpo{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.painel{background:var(--painel);border-top:3px solid var(--amarelo);width:100%;max-width:760px;max-height:92%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;transform:translateY(30px);transition:transform .25s}
.fundo.aberto .painel{transform:none}
@media (min-width:780px){.fundo{align-items:center}.painel{border-radius:20px;border:2px solid var(--amarelo);max-height:88%}}
@media (prefers-reduced-motion:reduce){.fundo,.painel,.combo{transition:none}}
.p-topo{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px 8px}
.p-topo h2{margin:0;font-family:"Oswald";font-weight:700;text-transform:uppercase;font-size:1.5rem;color:var(--amarelo);line-height:1.1}
.fechar{border:0;background:var(--painel2);width:38px;height:38px;border-radius:50%;font-size:1.1rem;flex:none}
.p-corpo{overflow-y:auto;padding:4px 18px 18px;flex:1}
.p-rodape{padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--linha);display:flex;gap:10px;align-items:center}
.foto-g{height:150px;display:grid;place-items:center;background:#000;border:1px solid #2A2410;border-radius:14px;margin-bottom:12px}
.foto-g img{max-height:130px;object-fit:contain}
.p-desc{margin:0;font-style:italic;color:#EDE7DA}
.grupo{margin-top:18px}
.grupo h4{margin:0;font-family:"Oswald";font-weight:600;text-transform:uppercase;font-size:1.05rem}
.grupo small{color:var(--cinza)}
.grupo small.obr{color:#000;background:var(--amarelo);border-radius:5px;padding:0 6px;font-weight:700}
.opc{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--linha)}
.opc label{display:flex;align-items:center;gap:10px;flex:1;cursor:pointer}
.opc input{width:20px;height:20px;accent-color:var(--amarelo)}
.opc .v{color:var(--amarelo);font-size:.95rem;font-weight:600}
textarea,input[type=text],input[type=tel],select{width:100%;border:1px solid #333;border-radius:10px;padding:11px 12px;background:#0B0B0B}
textarea{resize:vertical;min-height:62px}
.contador{display:flex;align-items:center;border:1.5px solid #3A3214;border-radius:12px;overflow:hidden;flex:none}
.contador button{border:0;background:none;width:40px;height:44px;font-size:1.35rem;font-weight:700;color:var(--amarelo)}
.contador span{min-width:26px;text-align:center;font-weight:700}
.btn{flex:1;border:0;border-radius:12px;padding:13px 16px;font-family:"Oswald";font-weight:700;font-size:1.05rem;text-transform:uppercase;background:var(--amarelo);color:#000;display:flex;justify-content:space-between;gap:8px}
.btn.zap{background:var(--verde);color:#fff;justify-content:center}
.linha{display:grid;grid-template-columns:1fr auto;gap:3px 12px;padding:12px 0;border-bottom:1px solid var(--linha)}
.linha .nome{font-weight:700}
.linha .extra{color:var(--cinza);font-size:.88rem;grid-column:1}
.linha .acoes{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.linha .contador button{width:34px;height:34px;font-size:1.15rem}
.remover{border:0;background:none;color:var(--vermelho);font-weight:600;font-size:.9rem;padding:4px 0}
.campo{margin-top:14px}
.campo > label{display:block;font-weight:600;font-size:.93rem;margin-bottom:6px}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}
.seg label{border:1.5px solid #333;border-radius:10px;padding:10px;text-align:center;font-weight:600;font-size:.93rem;cursor:pointer;position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){border-color:var(--amarelo);color:var(--amarelo);background:rgba(255,193,7,.08)}
.seg label:has(input:focus-visible){outline:3px solid var(--amarelo);outline-offset:2px}
.resumo{margin-top:18px;background:#0B0B0B;border:1px solid #2A2410;border-radius:12px;padding:12px 14px}
.resumo div{display:flex;justify-content:space-between;padding:3px 0}
.resumo .total{font-family:"Oswald";font-weight:700;font-size:1.25rem;color:var(--amarelo);border-top:1px solid #2A2410;margin-top:6px;padding-top:8px}
.aviso{color:var(--vermelho);font-size:.92rem;margin-top:10px;font-weight:600}
.oculto{display:none!important}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--amarelo);color:#000;padding:10px 16px;border-radius:10px;font-weight:700;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.img{display:block;background-repeat:no-repeat;background-position:center;background-size:contain}
.combo .img{width:100%;max-width:150px;height:72px;margin:6px auto 8px}
.combo .img.alta{height:90px}
.foto-cab.img{height:clamp(60px,15vw,80px)}
.foto-g .img{width:100%;height:130px}

  ]},
  { id:"bebidas", nome:"Bebidas", tipo:"linha", foto:"bebidas", itens:[
    { id:"b1", nome:"Água", desc:"500 ml", img:"agua", preco:4, grupos:[{ nome:"Tipo", min:1, max:1, opcoes:[{n:"Sem gás",p:0},{n:"Com gás",p:0}] }] },
    { id:"b2", nome:"Refri lata", desc:"350 ml", img:"lata", preco:6, grupos:[SABOR] },
    { id:"b3", nome:"Refri 600 ml", desc:"Garrafa", img:"garrafa", preco:9, grupos:[SABOR] },
    { id:"b4", nome:"Refri 2 litros", desc:"Para a família", img:"dois", preco:15, grupos:[SABOR] }
  ]}
];
/* ============ FIM DA CONFIGURAÇÃO ============ */

const FOTOS = {cind:"f-cind",cmin:"f-cmin",ccasa:"f-ccasa",ccasal:"f-ccasal",cfam:"f-cfam",logo:"f-logo",dog:"f-dog",pastel:"f-pastel",fritas:"f-fritas",bebidas:"f-bebidas",combo:"f-combo",agua:"f-agua",lata:"f-lata",garrafa:"f-garrafa",dois:"f-dois"};

const $ = s => document.querySelector(s);
const brl = v => v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const etiqueta = (v,peq) => { const [i,c]=v.toFixed(2).split("."); return `<span class="preco${peq?" p":""}"><span class="rs">R$</span><b>${i}</b><span class="c">,${c}</span></span>`; };
const todos = CATEGORIAS.flatMap(c => c.itens.map(i => ({...i, foto:i.img||c.foto})));

let sacola = [];
try { sacola = JSON.parse(localStorage.getItem("paraiso-sacola")) || []; } catch(e) { sacola = []; }
function salvar(){ try { localStorage.setItem("paraiso-sacola", JSON.stringify(sacola)); } catch(e){} }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"),1900); }

function estaAberta(){
  const agora=new Date(), m=agora.getHours()*60+agora.getMinutes();
  const [ah,am]=LOJA.horario.abre.split(":").map(Number), [fh,fm]=LOJA.horario.fecha.split(":").map(Number);
  const a=ah*60+am, f=fh*60+fm;
  return f>a ? (m>=a && m<f) : (m>=a || m<f);
}
function cabecalho(){
  const ab=estaAberta();
  $("#statusTxt").textContent= ab ? "Aberto até "+LOJA.horario.fecha : "Fechado · abre às "+LOJA.horario.abre;
  $("#statusDot").classList.toggle("fechado",!ab);
  $("#tempoTxt").textContent="🛵 "+LOJA.tempo;
  $("#cBairro").innerHTML=`<option value="">Selecione seu bairro</option>`+LOJA.bairros.map((b,i)=>`<option value="${i}">${b.nome} · ${brl(b.taxa)}</option>`).join("");
}

function card(i,c){
  const foto=FOTOS[i.img||c.foto], alta=(i.img && c.id==="bebidas" ? " alta":"");
  const naSacola=sacola.filter(s=>s.id===i.id).reduce((s,x)=>s+x.qtd,0);
  return `<div class="combo" data-id="${i.id}" role="button" tabindex="0" aria-label="${i.nome}, ${brl(i.preco)}">
    ${i.antigo?`<span class="eco">Economize ${brl(i.antigo-i.preco)}</span>`:""}
    <h3><span>${i.nome}</span></h3><p>${i.desc||""}</p>
    <span class="img ${foto}${alta}" aria-hidden="true"></span>
    <div class="val">${i.antigo?`<div class="de">De: ${brl(i.antigo)}</div>`:""}<div class="por">${i.antigo?"<small>Por</small>":""}${brl(i.preco)}</div></div>
    <button class="add" data-add="${i.id}">+ Adicionar</button>
    <div class="na">${naSacola?`✓ ${naSacola} na sacola`:""}</div>
  </div>`;
}
function renderCardapio(){
  let h="";
  CATEGORIAS.forEach(c=>{
    h+=`<section class="cat" id="cat-${c.id}">
      <div class="cab"><h2 class="pincel"><span>${c.nome}</span></h2>${c.tipo!=="combo"?`<span class="foto-cab img ${FOTOS[c.foto]}" aria-hidden="true"></span>`:""}</div>
      <div class="caixa"><div class="combos${c.tipo==="combo"?"":" grade"}">${c.itens.map(i=>card(i,c)).join("")}</div>`;
    if(c.adicionais) h+=`<div class="adic">`+c.adicionais.map(a=>`<div class="linha-p"><span class="n">${a.n}</span><span class="pont"></span>${etiqueta(a.p,true)}</div>`).join("")+`</div>`;
    h+=`</div></section>`;
  });
  $("#cardapio").innerHTML=h;
}
function renderAbas(){
  $("#abas").innerHTML=CATEGORIAS.map((c,i)=>`<button class="aba${i===0?" ativa":""}" data-cat="${c.id}">${c.nome}</button>`).join("");
}
$("#abas").addEventListener("click",e=>{
  const b=e.target.closest(".aba"); if(!b) return;
  const alvo=document.getElementById("cat-"+b.dataset.cat); if(alvo) window.scrollTo(0, alvo.getBoundingClientRect().top+window.scrollY-60);
});
let abaAtual=null, pedido=false;
function marcarAba(){
  pedido=false;
  let atual=CATEGORIAS[0].id;
  for(const c of CATEGORIAS){ const el=document.getElementById("cat-"+c.id); if(el && el.getBoundingClientRect().top<140) atual=c.id; }
  if(atual===abaAtual) return;
  abaAtual=atual;
  const barra=$("#abas");
  barra.querySelectorAll(".aba").forEach(a=>{
    const on=a.dataset.cat===atual; a.classList.toggle("ativa",on);
    if(on) barra.scrollLeft=a.offsetLeft-(barra.clientWidth-a.offsetWidth)/2;  /* só a faixa de abas, não a página */
  });
}
window.addEventListener("scroll",()=>{ if(!pedido){ pedido=true; requestAnimationFrame(marcarAba); } },{passive:true});

function abrir(id){ $(id).classList.add("aberto"); document.documentElement.style.overflow="hidden"; }
function fechar(el){ el.classList.remove("aberto"); if(!document.querySelector(".fundo.aberto")) document.documentElement.style.overflow=""; }
document.querySelectorAll(".fundo").forEach(f=>f.addEventListener("click",e=>{ if(e.target===f || e.target.closest("[data-fechar]")) fechar(f); }));
document.addEventListener("keydown",e=>{ if(e.key==="Escape") document.querySelectorAll(".fundo.aberto").forEach(fechar); });

/* Produto */
let atual=null, qtd=1;
function abrirProduto(id){ atual=todos.find(i=>i.id===id); qtd=1; renderProduto(); abrir("#fundoProduto"); }
$("#cardapio").addEventListener("click",e=>{
  const add=e.target.closest("[data-add]");
  if(add){
    const it=todos.find(i=>i.id===add.dataset.add);
    if((it.grupos||[]).length){ abrirProduto(it.id); return; }
    const ja=sacola.find(s=>s.id===it.id && !s.extras.length && !s.obs);
    if(ja) ja.qtd++; else sacola.push({ id:it.id, nome:it.nome, unit:it.preco, qtd:1, extras:[], obs:"" });
    salvar(); atualizarBarra(); toast(`${it.nome} na sacola!`); return;
  }
  const b=e.target.closest("[data-id]"); if(b) abrirProduto(b.dataset.id);
});
$("#cardapio").addEventListener("keydown",e=>{
  if((e.key==="Enter"||e.key===" ") && e.target.matches(".combo[data-id]")){ e.preventDefault(); abrirProduto(e.target.dataset.id); }
});
function renderProduto(){
  const i=atual;
  $("#pNome").textContent=i.nome;
  let h=`<div class="foto-g"><span class="img ${FOTOS[i.foto]}" aria-hidden="true"></span></div>${i.desc?`<p class="p-desc">${i.desc}</p>`:""}`;
  (i.grupos||[]).forEach((g,gi)=>{
    const tipo=g.max===1?"radio":"checkbox";
    const regra=g.min>0?`<small class="obr">Obrigatório</small>`:`<small>Opcional</small>`;
    h+=`<div class="grupo"><h4>${g.nome}</h4>${regra}`;
    g.opcoes.forEach((o,oi)=>{
      h+=`<div class="opc"><label><input type="${tipo}" name="g${gi}" data-g="${gi}" data-o="${oi}">${o.n}</label><span class="v">${o.p?"+ "+brl(o.p):""}</span></div>`;
    });
    h+="</div>";
  });
  h+=`<div class="campo"><label for="pObs">Alguma observação?</label><textarea id="pObs" placeholder="Ex.: sem cebola, sem tomate"></textarea></div>`;
  $("#pCorpo").innerHTML=h; $("#pCorpo").scrollTop=0; atualizarPreco();
}
function escolhas(){
  const sel=[]; $("#pCorpo").querySelectorAll("input:checked").forEach(x=>sel.push({...atual.grupos[x.dataset.g].opcoes[x.dataset.o]}));
  return sel;
}
function atualizarPreco(){
  const unit=atual.preco+escolhas().reduce((s,o)=>s+o.p,0);
  $("#pQtd").textContent=qtd; $("#pTotal").textContent=brl(unit*qtd);
}
$("#pCorpo").addEventListener("change",e=>{
  const x=e.target;
  if(x.type==="checkbox"){
    const g=atual.grupos[x.dataset.g];
    if($("#pCorpo").querySelectorAll(`input[data-g="${x.dataset.g}"]:checked`).length>g.max){ x.checked=false; toast(`Escolha até ${g.max} em ${g.nome.toLowerCase()}`); }
  }
  atualizarPreco();
});
$("#pMenos").onclick=()=>{ if(qtd>1){qtd--;atualizarPreco();} };
$("#pMais").onclick=()=>{ qtd++; atualizarPreco(); };
$("#pAdd").onclick=()=>{
  const falta=(atual.grupos||[]).find((g,gi)=>g.min>0 && !$("#pCorpo").querySelector(`input[data-g="${gi}"]:checked`));
  if(falta){ toast(`Escolha: ${falta.nome.toLowerCase()}`); return; }
  const sel=escolhas();
  sacola.push({ id:atual.id, nome:atual.nome, unit:atual.preco+sel.reduce((s,o)=>s+o.p,0), qtd, extras:sel.map(o=>o.n), obs:$("#pObs").value.trim() });
  salvar(); atualizarBarra(); fechar($("#fundoProduto")); toast(`${atual.nome} na sacola!`);
};

/* Sacola */
const subtotal=()=>sacola.reduce((s,i)=>s+i.unit*i.qtd,0);
const ehEntrega=()=>document.querySelector('input[name="entrega"]:checked').value==="entrega";
const taxa=()=>(ehEntrega() && $("#cBairro").value!=="")?LOJA.bairros[$("#cBairro").value].taxa:0;
function atualizarBarra(){
  const n=sacola.reduce((s,i)=>s+i.qtd,0);
  document.querySelectorAll(".combo[data-id]").forEach(el=>{
    const q=sacola.filter(s=>s.id===el.dataset.id).reduce((s,x)=>s+x.qtd,0);
    el.querySelector(".na").textContent=q?`✓ ${q} na sacola`:"";
  });
  $("#barra").hidden=n===0; $("#barraQtd").textContent=n; $("#barraTotal").textContent=brl(subtotal());
}
function renderSacola(){
  if(!sacola.length){ fechar($("#fundoCarrinho")); return; }
  $("#cItens").innerHTML=sacola.map((i,k)=>`<div class="linha">
    <span class="nome">${i.qtd}× ${i.nome}</span><span>${brl(i.unit*i.qtd)}</span>
    ${i.extras.length?`<span class="extra">${i.extras.join(", ")}</span>`:""}
    ${i.obs?`<span class="extra">Obs.: ${i.obs}</span>`:""}
    <div class="acoes"><button class="remover" data-rm="${k}">Remover</button>
    <div class="contador"><button data-menos="${k}" aria-label="Diminuir">−</button><span>${i.qtd}</span><button data-mais="${k}" aria-label="Aumentar">+</button></div></div>
  </div>`).join("");
  $("#blocoEndereco").classList.toggle("oculto",!ehEntrega());
  $("#blocoTroco").classList.toggle("oculto",document.querySelector('input[name="pag"]:checked').value!=="Dinheiro");
  $("#rSub").textContent=brl(subtotal()); $("#rTaxa").textContent=!ehEntrega()?"Retirada":($("#cBairro").value===""?"Escolha o bairro":brl(taxa()));
  $("#rTotal").textContent=brl(subtotal()+taxa());
  $("#aviso").textContent="";
}
$("#abrirCarrinho").onclick=()=>{ renderSacola(); abrir("#fundoCarrinho"); };
$("#cItens").addEventListener("click",e=>{
  const t=e.target;
  if(t.dataset.rm!==undefined) sacola.splice(+t.dataset.rm,1);
  else if(t.dataset.mais!==undefined) sacola[+t.dataset.mais].qtd++;
  else if(t.dataset.menos!==undefined){ const i=sacola[+t.dataset.menos]; i.qtd>1?i.qtd--:sacola.splice(+t.dataset.menos,1); }
  else return;
  salvar(); atualizarBarra(); renderSacola();
});
document.querySelectorAll('input[name="entrega"],input[name="pag"]').forEach(x=>x.addEventListener("change",renderSacola));
$("#cBairro").addEventListener("change",renderSacola);

$("#enviar").onclick=()=>{
  const nome=$("#cNome").value.trim(), fone=$("#cFone").value.trim(), entrega=ehEntrega();
  const falta=[];
  if(!nome) falta.push("seu nome"); if(!fone) falta.push("seu WhatsApp");
  if(entrega && $("#cBairro").value==="") falta.push("o bairro"); if(entrega && !$("#cRua").value.trim()) falta.push("rua e número");
  if(falta.length){ $("#aviso").textContent="Preencha "+falta.join(", ")+" para enviar."; return; }
  if(LOJA.pedidoMinimo && subtotal()<LOJA.pedidoMinimo){ $("#aviso").textContent=`O pedido mínimo é ${brl(LOJA.pedidoMinimo)}.`; return; }
  if(!estaAberta() && !confirm("Estamos fechados agora. Enviar o pedido mesmo assim?")) return;

  const pag=document.querySelector('input[name="pag"]:checked').value;
  let m=`*🌭 Novo pedido · ${LOJA.nome}*\n\n`;
  sacola.forEach(i=>{
    m+=`*${i.qtd}× ${i.nome}* — ${brl(i.unit*i.qtd)}\n`;
    if(i.extras.length) m+=`   ${i.extras.join(", ")}\n`;
    if(i.obs) m+=`   Obs.: ${i.obs}\n`;
  });
  m+=`\nSubtotal: ${brl(subtotal())}\n`;
  m+= entrega ? `Entrega: ${brl(taxa())}\n` : `Retirada no local\n`;
  m+=`*Total: ${brl(subtotal()+taxa())}*\n\n`;
  m+=`*Cliente:* ${nome}\n*Telefone:* ${fone}\n`;
  if(entrega){
    m+=`*Endereço:* ${$("#cRua").value.trim()}, ${LOJA.bairros[$("#cBairro").value].nome}\n`;
    if($("#cRef").value.trim()) m+=`*Referência:* ${$("#cRef").value.trim()}\n`;
  }
  m+=`*Pagamento:* ${pag}`;
  if(pag==="Dinheiro" && $("#cTroco").value.trim()) m+=` (troco para R$ ${$("#cTroco").value.trim()})`;
  if($("#cObs").value.trim()) m+=`\n*Observações:* ${$("#cObs").value.trim()}`;

  window.open(`https://wa.me/${LOJA.whatsapp}?text=${encodeURIComponent(m)}`,"_blank");
  try { localStorage.setItem("paraiso-cliente",JSON.stringify({nome,fone,rua:$("#cRua").value,ref:$("#cRef").value,bairro:$("#cBairro").value})); } catch(e){}
  sacola=[]; salvar(); atualizarBarra(); fechar($("#fundoCarrinho")); toast("Pedido enviado! Obrigado pela preferência 💛");
};

cabecalho(); renderAbas(); renderCardapio(); atualizarBarra();
try { const c=JSON.parse(localStorage.getItem("paraiso-cliente")); if(c){ $("#cNome").value=c.nome||""; $("#cFone").value=c.fone||""; $("#cRua").value=c.rua||""; $("#cRef").value=c.ref||""; if(c.bairro) $("#cBairro").value=c.bairro; } } catch(e){}
</script>
</body>
</html>
